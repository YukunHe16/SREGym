agents:
  - name: stratus
    kickoff_command: python -m clients.stratus.stratus_agent.driver.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: null
    agent_version: null
  - name: autosubmit
    kickoff_command: python -m clients.autosubmit.autosubmit_agent
    kickoff_workdir: .
    kickoff_env: null
    install_script: null
    agent_version: null
  - name: codex
    kickoff_command: python -m clients.codex.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-codex.sh
    agent_version: "0.154.0"
  - name: claudecode
    kickoff_command: python -m clients.claudecode.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-claudecode.sh
    agent_version: null
  - name: "debug"
    kickoff_command: "python -c \"import signal; signal.pause()\""
    install_script: null
    agent_version: null
  - name: gemini
    kickoff_command: python -m clients.geminicli.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-gemini.sh
    agent_version: null
  - name: opencode
    kickoff_command: python -m clients.opencode.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-opencode.sh
    agent_version: null
  - name: tierzero
    kickoff_command: python -m clients.tierzero.driver
    kickoff_workdir: .
    kickoff_env:
      TIERZERO_API_URL: "https://app.tierzero.ai"
      TIERZERO_ORG_API_KEY: "<your-api-key>"
    install_script: null
    agent_version: null
    container_isolation: false
  - name: copilot
    kickoff_command: python -m clients.copilot.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-copilot.sh
    agent_version: null
  - name: cursor
    kickoff_command: python -m clients.cursor.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-cursor.sh
    agent_version: null
  - name: demo
    kickoff_command: python -m clients.demo.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: null
    agent_version: null
    container_isolation: false
  # Baseline agent arms: one model-chosen shell command per step, bounded by a
  # command budget (b0 / b1 / b3 / b10 / bU = unlimited) and a submission mode
  # (full = free-text diagnosis; nomech = component, affected parts and symptom only).
  - name: baseline_b0_full
    kickoff_command: python -m clients.baseline.driver
    kickoff_workdir: .
    kickoff_env: {BASELINE_MAX_COMMANDS: "0", BASELINE_SUBMISSION_MODE: full, BASELINE_BACKEND: codex}
    install_script: install-codex.sh
    agent_version: "0.154.0"
  - name: baseline_b1_full
    kickoff_command: python -m clients.baseline.driver
    kickoff_workdir: .
    kickoff_env: {BASELINE_MAX_COMMANDS: "1", BASELINE_SUBMISSION_MODE: full, BASELINE_BACKEND: codex}
    install_script: install-codex.sh
    agent_version: "0.154.0"
  - name: baseline_b3_full
    kickoff_command: python -m clients.baseline.driver
    kickoff_workdir: .
    kickoff_env: {BASELINE_MAX_COMMANDS: "3", BASELINE_SUBMISSION_MODE: full, BASELINE_BACKEND: codex}
    install_script: install-codex.sh
    agent_version: "0.154.0"
  - name: baseline_b10_full
    kickoff_command: python -m clients.baseline.driver
    kickoff_workdir: .
    kickoff_env: {BASELINE_MAX_COMMANDS: "10", BASELINE_SUBMISSION_MODE: full, BASELINE_BACKEND: codex}
    install_script: install-codex.sh
    agent_version: "0.154.0"
  - name: baseline_bU_full
    kickoff_command: python -m clients.baseline.driver
    kickoff_workdir: .
    kickoff_env: {BASELINE_MAX_COMMANDS: unlimited, BASELINE_SUBMISSION_MODE: full, BASELINE_BACKEND: codex}
    install_script: install-codex.sh
    agent_version: "0.154.0"
  - name: baseline_b3_nomech
    kickoff_command: python -m clients.baseline.driver
    kickoff_workdir: .
    kickoff_env: {BASELINE_MAX_COMMANDS: "3", BASELINE_SUBMISSION_MODE: no_mechanism, BASELINE_BACKEND: codex}
    install_script: install-codex.sh
    agent_version: "0.154.0"
  - name: baseline_b10_nomech
    kickoff_command: python -m clients.baseline.driver
    kickoff_workdir: .
    kickoff_env: {BASELINE_MAX_COMMANDS: "10", BASELINE_SUBMISSION_MODE: no_mechanism, BASELINE_BACKEND: codex}
    install_script: install-codex.sh
    agent_version: "0.154.0"
  # Provider-key arm: unlimited budget, normal submission, LiteLLM against AGENT_API_BASE/AGENT_API_KEY.
  # Thinking switch and effort ride in BASELINE_EXTRA_BODY / --reasoning-effort (GLM-5.3: max, high, low).
  - name: baseline_bU_full_api
    kickoff_command: python -m clients.baseline.driver
    kickoff_workdir: .
    kickoff_env:
      BASELINE_BACKEND: api
      BASELINE_MAX_COMMANDS: unlimited
      BASELINE_SUBMISSION_MODE: full
      BASELINE_HARD_CAP: "80"
      BASELINE_DEADLINE_S: "1500"
      BASELINE_MAX_TOKENS: "32768"
      BASELINE_EXTRA_BODY: '{"thinking": {"type": "enabled"}}'
    install_script: null
    agent_version: null
  # Same as baseline_bU_full_api but with one growing conversation: the model's replies and its
  # reasoning_content go back each step (clear_thinking=false keeps them in Z.ai's context).
  - name: baseline_bU_full_api_session
    kickoff_command: python -m clients.baseline.driver
    kickoff_workdir: .
    kickoff_env:
      BASELINE_BACKEND: api
      BASELINE_CONTEXT: session
      BASELINE_MAX_COMMANDS: unlimited
      BASELINE_SUBMISSION_MODE: full
      BASELINE_HARD_CAP: "80"
      BASELINE_DEADLINE_S: "1500"
      BASELINE_MAX_TOKENS: "32768"
      BASELINE_EXTRA_BODY: '{"thinking": {"type": "enabled", "clear_thinking": false}}'
    install_script: null
    agent_version: null
